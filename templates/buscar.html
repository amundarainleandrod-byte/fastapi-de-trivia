<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trivias — Buscar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #fdf6e3; }
        h1 { color: #8a6d00; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #c5b565; padding: 8px; text-align: left; }
        th { background: #ffe08a; }
        input { padding: 6px; width: 250px; }
        button { background: #8a6d00; color: white; border: none; padding: 6px 14px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Buscar Trivia</h1>
    <a href="/">← Volver al inicio</a>

    <form action="/buscar" method="get" autocomplete="off">
        <input type="text" name="busqueda" value="{{ busqueda }}" placeholder="ID o texto de la pregunta">
        <button type="submit">Buscar</button>
    </form>

    {% if busqueda %}
        {% if questions %}
        <table>
            <tr><th>ID</th><th>Pregunta</th><th>Respuesta</th><th>Género</th></tr>
            {% for q in questions %}
            <tr>
                <td>{{ q["id"] }}</td>
                <td>{{ q["pregunta"] }}</td>
                <td>{{ q["respuesta"] }}</td>
                <td>{{ q["trivia"] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p>No se encontraron resultados para "{{ busqueda }}".</p>
        {% endif %}
    {% endif %}
</body>
</html>
